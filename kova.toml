# Kova engine configuration.
#
# Every key below can also be set through an environment variable.
# Precedence: environment variable > this file > built-in default.
# Point KOVA_CONFIG at another file to load a different profile.

# TCP port for the MongoDB wire protocol listener.
# 27018 keeps Kova off the port a local mongod already uses.
# Env: KOVA_PORT
port = 27018

# Minimum log level: "debug" | "info" | "warn" | "error".
# Env: KOVA_LOG_LEVEL
log_level = "info"

# Emit a WARN log when a query uses operators MongoDB does not define:
# Kova extensions such as $text.$boost / $text.$decay, or operators the
# engine does not implement yet. Set to false to silence them.
# Env: KOVA_WARN_NON_MONGO_QUERIES
warn_on_non_mongo_queries = true

[search]
# Token pipeline for indexed text fields (fixed at index creation):
#   "default" - split on punctuation/whitespace, lowercase
#   "en_stem" - default plus English stemming (better recall)
analyzer = "default"

# Extra stop words removed at index and query time, e.g. ["the", "a"].
# Empty by default: stop-word removal is language-dependent.
stopwords = []

[storage]
# Root directory for the WAL, checkpoint manifest, and page files.
# Each partition writes under partition-{id}/.
# Env: KOVA_DATA_DIR
data_dir = "data"

# Fixed page size in bytes. Checkpoint images that do not fit are split.
# Env: KOVA_PAGE_SIZE
page_size = 16384

# Pages kept in the per-partition buffer pool.
# Env: KOVA_BUFFER_POOL_PAGES
buffer_pool_pages = 4096

# fsync every WAL append before the change is applied in memory.
# Env: KOVA_WAL_FSYNC
wal_fsync = true

# Roll to a new segment once the current one would pass this size.
wal_segment_bytes = 16777216

# Snapshot the working set after this many mutations. Shutdown also
# checkpoints. 0 disables the periodic snapshot.
checkpoint_every = 128
