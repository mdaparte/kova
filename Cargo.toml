[package]
name = "kovadb"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
description = "Database you talk to with a MongoDB driver. Stores documents, answers SQL, and searches text."
repository = "https://github.com/mdaparte/kova"
readme = "README.md"
keywords = ["database", "mongodb", "sql"]
categories = ["database"]
autobins = false

[lib]
name = "kova"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "kova"
path = "src/main.rs"

[[bin]]
name = "kovadump"
path = "src/bin/kovadump.rs"

[[bin]]
name = "kova-setup"
path = "src/bin/kova-setup.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
bson = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tantivy = "0.22"
crossbeam-channel = "0.5"
datafusion = "45"
regex = "1"
async-trait = "0.1.92"
serde_json = "1"
openraft = { version = "0.9", default-features = false, features = ["serde", "storage-v2"] }
zstd = "0.13"
argon2 = "0.5"
aes-gcm = "0.10"
# Client 0.7.0 matches Apache Iggy tag server-0.5.0. The release builds that iggy-server.
iggy = "0.7"
getrandom = "0.2"
toml_edit = "0.22"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
