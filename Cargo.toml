[package]
name = "kova"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "kova"
crate-type = ["lib", "cdylib"]

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
bson = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tantivy = "0.22"
crossbeam-channel = "0.5"
datafusion = "45"
regex = "1"
async-trait = "0.1.92"
serde_json = "1"
openraft = { version = "0.9", default-features = false, features = ["serde", "storage-v2"] }
zstd = "0.13"
argon2 = "0.5"
aes-gcm = "0.10"
