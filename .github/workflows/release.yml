name: Release

# A merge into main is a push. This builds the optimized binaries and
# publishes them on the GitHub release for that commit, and pushes the
# same binaries as a public image on GHCR. The asset names and the
# :latest tag stay the same, so both download URLs follow the newest build.
on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Pack
        run: |
          set -eu
          name=kova-x86_64-unknown-linux-gnu
          stage="$RUNNER_TEMP/$name"
          mkdir -p "$stage" dist
          cp target/release/kova target/release/kovadump target/release/libkova.so "$stage/"
          cp kova.toml scripts/seed-oracle.js packaging/install.sh LICENSE NOTICE "$stage/"
          chmod 755 "$stage/kova" "$stage/kovadump" "$stage/libkova.so" "$stage/install.sh"
          tar -C "$RUNNER_TEMP" -czf "dist/$name.tar.gz" "$name"
          sha256sum "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"
          cp packaging/get.sh dist/install.sh
          chmod 755 dist/install.sh

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/kova-x86_64-unknown-linux-gnu
          file: packaging/Dockerfile
          push: true
          tags: |
            ghcr.io/mdaparte/kova:latest
            ghcr.io/mdaparte/kova:${{ github.sha }}

      - name: Make the image public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /user/packages/container/kova \
            -f visibility=public
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "The image was pushed. If this is the first publish, set the package to Public:"
            echo "https://github.com/mdaparte/pkgs/container/kova"
          fi

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-${{ github.sha }}
          name: Kova ${{ github.sha }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Optimized Linux x86_64 build of this commit.

            Install: `install.sh` puts `kova`, `kovadump`, and `libkova.so` under `$HOME/.local`.
            Image: `docker run --rm -p 27018:27018 -v kova:/var/lib/kova ghcr.io/mdaparte/kova:latest`
          files: |
            dist/kova-x86_64-unknown-linux-gnu.tar.gz
            dist/kova-x86_64-unknown-linux-gnu.tar.gz.sha256
            dist/install.sh
