name: Release

# A merge into main is a push. This builds the optimized binaries and
# publishes them on the GitHub release for that commit, and pushes the
# same binaries as a public image on GHCR. The Linux job opens the release.
# The Windows and Mac jobs attach their installers after that. The asset
# names and the :latest tag stay the same, so the download URLs follow
# the newest build.
on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Build iggy-server
        run: packaging/fetch-iggy-server.sh "$RUNNER_TEMP/iggy-server"

      - name: Pack
        run: |
          set -eu
          name=kova-x86_64-unknown-linux-gnu
          stage="$RUNNER_TEMP/$name"
          mkdir -p "$stage" dist
          cp target/release/kova target/release/kovadump target/release/libkova.so "$stage/"
          cp "$RUNNER_TEMP/iggy-server/iggy-server" "$stage/"
          cp "$RUNNER_TEMP/iggy-server/NOTICE-iggy" "$RUNNER_TEMP/iggy-server/LICENSE-iggy" "$stage/"
          if [ -f "$RUNNER_TEMP/iggy-server/DEPENDENCIES-iggy" ]; then
            cp "$RUNNER_TEMP/iggy-server/DEPENDENCIES-iggy" "$stage/"
          fi
          cp kova.toml scripts/seed-oracle.js packaging/install.sh LICENSE NOTICE "$stage/"
          chmod 755 "$stage/kova" "$stage/kovadump" "$stage/iggy-server" "$stage/libkova.so" "$stage/install.sh"
          tar -C "$RUNNER_TEMP" -czf "dist/$name.tar.gz" "$name"
          sha256sum "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"
          cp packaging/get.sh dist/install.sh
          chmod 755 dist/install.sh

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/kova-x86_64-unknown-linux-gnu
          file: packaging/Dockerfile
          push: true
          tags: |
            ghcr.io/mdaparte/kova:latest
            ghcr.io/mdaparte/kova:${{ github.sha }}

      - name: Make the image public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /user/packages/container/kova \
            -f visibility=public
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "The image was pushed. If this is the first publish, set the package to Public:"
            echo "https://github.com/mdaparte/pkgs/container/kova"
          fi

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-${{ github.sha }}
          name: Kova ${{ github.sha }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Optimized build of this commit.

            Linux: `install.sh` puts `kova`, `kovadump`, `iggy-server`, and `libkova.so` under `$HOME/.local`.
            `iggy-server` is Apache Iggy tag server-0.5.0. Kova does not start it. It listens on 127.0.0.1:8090.
            Windows: run `Kova-x64-setup.exe`. It is not signed.
            Mac: open `Kova-aarch64.dmg` and drag Kova to Applications. The disk image is not notarized.
            Image: `docker run --rm -p 27018:27018 -v kova:/var/lib/kova ghcr.io/mdaparte/kova:latest`
          files: |
            dist/kova-x86_64-unknown-linux-gnu.tar.gz
            dist/kova-x86_64-unknown-linux-gnu.tar.gz.sha256
            dist/install.sh

  mac:
    needs: linux
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Build iggy-server
        run: packaging/fetch-iggy-server.sh "$RUNNER_TEMP/iggy-server"

      - name: Pack the disk image
        run: |
          set -eu
          stage="$RUNNER_TEMP/mac-bins"
          mkdir -p "$stage" dist
          cp target/release/kova target/release/kova-setup target/release/kovadump "$stage/"
          cp "$RUNNER_TEMP/iggy-server/iggy-server" "$stage/"
          cp "$RUNNER_TEMP/iggy-server/NOTICE-iggy" "$RUNNER_TEMP/iggy-server/LICENSE-iggy" "$stage/"
          if [ -f "$RUNNER_TEMP/iggy-server/DEPENDENCIES-iggy" ]; then
            cp "$RUNNER_TEMP/iggy-server/DEPENDENCIES-iggy" "$stage/"
          fi
          BINS="$stage" OUT="dist/Kova-aarch64.dmg" packaging/macos/build-dmg.sh
          shasum -a 256 dist/Kova-aarch64.dmg > dist/Kova-aarch64.dmg.sha256

      - name: Publish the disk image
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-${{ github.sha }}
          files: |
            dist/Kova-aarch64.dmg
            dist/Kova-aarch64.dmg.sha256

  windows:
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Build iggy-server
        shell: bash
        run: packaging/fetch-iggy-server.sh "$RUNNER_TEMP/iggy-server"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Pack the installer
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'win-bins'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target\release\kova.exe, target\release\kova-setup.exe, target\release\kovadump.exe $stage
          Copy-Item "$env:RUNNER_TEMP\iggy-server\iggy-server.exe" $stage
          foreach ($extra in @('LICENSE-iggy', 'NOTICE-iggy', 'DEPENDENCIES-iggy')) {
            $path = Join-Path "$env:RUNNER_TEMP\iggy-server" $extra
            if (Test-Path -LiteralPath $path) { Copy-Item $path $stage }
          }
          $env:BINS = $stage
          $env:OUT = 'dist'
          ./packaging/windows/build-setup.ps1

      - name: Publish the installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-${{ github.sha }}
          files: |
            dist/Kova-x64-setup.exe
            dist/Kova-x64-setup.exe.sha256
